name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Linux
            os: ubuntu-24.04
          - target: Linux_ARM
            os: ubuntu-24.04-arm
          - target: Windows
            os: windows-2025
            msystem: UCRT64
            msys2_release: false
            msys2_packages: >-
              base-devel
              mingw-w64-ucrt-x86_64-toolchain
              mingw-w64-ucrt-x86_64-gcc
              mingw-w64-ucrt-x86_64-gcc-libs
              mingw-w64-ucrt-x86_64-make
              mingw-w64-ucrt-x86_64-libtiff
              mingw-w64-ucrt-x86_64-libpng
              mingw-w64-ucrt-x86_64-libwebp
              mingw-w64-ucrt-x86_64-libjpeg-turbo
              mingw-w64-ucrt-x86_64-jbigkit
              mingw-w64-ucrt-x86_64-lerc
              mingw-w64-ucrt-x86_64-zstd
              mingw-w64-ucrt-x86_64-xz
              mingw-w64-ucrt-x86_64-zlib
              mingw-w64-ucrt-x86_64-libdeflate
          - target: Windows_ARM
            os: windows-11-arm
            msystem: CLANGARM64
            msys2_release: true
            msys2_packages: >-
              base-devel
              mingw-w64-clang-aarch64-clang
              mingw-w64-clang-aarch64-llvm-openmp
              mingw-w64-clang-aarch64-toolchain
              mingw-w64-clang-aarch64-gcc-compat
              mingw-w64-clang-aarch64-libtiff
              mingw-w64-clang-aarch64-libpng
              mingw-w64-clang-aarch64-libwebp
              mingw-w64-clang-aarch64-libjpeg-turbo
              mingw-w64-clang-aarch64-jbigkit
              mingw-w64-clang-aarch64-lerc
              mingw-w64-clang-aarch64-zstd
              mingw-w64-clang-aarch64-xz
              mingw-w64-clang-aarch64-zlib
              mingw-w64-clang-aarch64-libdeflate
          - target: macOS_ARM
            os: macos-15

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ make libgomp1 file \
            libtiff-dev libdeflate-dev libpng-dev libwebp-dev libjpeg-dev \
            libjbig-dev liblerc-dev libsharpyuv-dev libzstd-dev \
            liblzma-dev zlib1g-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc liblerc libdeflate libtiff jpeg-turbo \
            libpng webp jbigkit zstd xz

      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          release: ${{ matrix.msys2_release }}
          update: true
          install: ${{ matrix.msys2_packages }}

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash ./source/deploy.sh ${{ matrix.target }}

      - name: Build static codecs for macOS 11 (macOS)
        if: matrix.target == 'macOS_ARM'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/Esri/lerc/archive/refs/tags/v4.3.0.tar.gz
          tar xzf v4.3.0.tar.gz
          cmake -S lerc-4.3.0 -B lerc-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build lerc-build -j 4
          echo "MSPA_LERC_A=$(pwd)/lerc-build/libLerc.a" >> "$GITHUB_ENV"
          echo "MSPA_DEFLATE_A=$(brew --prefix libdeflate)/lib/libdeflate.a" >> "$GITHUB_ENV"

      - name: Build and test (Linux and macOS)
        if: runner.os != 'Windows'
        run: bash ./source/deploy.sh ${{ matrix.target }}

      - name: Upload the standalone binary
        uses: actions/upload-artifact@v6
        with:
          name: mspa-${{ matrix.target }}
          path: source/mspa_dist_*/
          if-no-files-found: error

  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Check that no build artifacts are tracked
        run: |
          bad="$(git ls-files | grep -E '(^|/)(mspa_dist_)|\.(o|a|so|dylib|dll|exe)$|(^|/)banner\.h$|(^|/)\.DS_Store$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::Build artifacts must not be committed to the repository:"
            echo "$bad"
            exit 1
          fi
          echo "No build artifacts are tracked."
